<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Coastal Kitchen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌊 Coastal Kitchen</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="offers.html">Offers</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5" style="padding-top: 100px;">
        <div class="text-center mb-4">
            <h1 class="fw-bold">💖 Your Wishlist</h1>
            <p class="lead">Items you saved for later</p>
        </div>

        <div id="wishlistItems"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
    <script>
        function displayWishlist() {
            wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
            const container = document.getElementById("wishlistItems");
            container.innerHTML = "";

            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info text-center">
                        💬 Your wishlist is empty.
                    </div>
                `;
                return;
            }

            wishlist.forEach((item, index) => {
                container.innerHTML += `
                    <div class="card mb-3 shadow-sm">
                        <div class="row g-0 align-items-center">
                            <div class="col-md-3 text-center p-2">
                                <img src="${item.image}" class="img-fluid rounded" style="height:120px; object-fit:cover;">
                            </div>
                            <div class="col-md-5">
                                <div class="card-body">
                                    <h5>${item.name}</h5>
                                    <p class="mb-1">Price: ₹${item.price}</p>
                                </div>
                            </div>
                            <div class="col-md-4 text-center">
                                <button class="btn btn-primary me-2" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price}, '${item.image}')">Add to Cart</button>
                                <button class="btn btn-outline-danger" onclick="removeFromWishlist(${index}); displayWishlist();">Remove</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (typeof updateWishlistCount === 'function') updateWishlistCount();
            if (typeof updateCartCount === 'function') updateCartCount();
            displayWishlist();
        });
    </script>
</body>

</html>
