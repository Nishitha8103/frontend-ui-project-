<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Coastal Kitchen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f8f9fa; padding-top: 90px; }
        .cart-img { width:100%; height:120px; object-fit:cover; }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌊 Coastal Kitchen</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="menu.html" class="btn btn-warning">← Back to Menu</a>
                <a href="cart.html" class="btn btn-outline-light position-relative">🛒
                    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <a href="wishlist.html" class="btn btn-outline-light position-relative">💖
                    <span id="wishlistCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <a href="profile.html" class="btn btn-outline-light" title="Profile">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-4">🛒 Shopping Cart</h1>

        <div id="cartItems"></div>

        <div class="card p-4 shadow mt-4">
            <h3>Total Bill: ₹ <span id="totalPrice">0</span></h3>
            <div class="d-flex justify-content-center gap-2 mt-3">
                <button class="btn btn-danger" onclick="confirmClearCart()">Clear Cart</button>
                <button class="btn btn-success" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
    <script>
        if (typeof displayCart === 'function') displayCart();
        if (typeof updateCartCount === 'function') updateCartCount();
        if (typeof updateWishlistCount === 'function') updateWishlistCount();

        function placeOrder() {
            if (!cart || cart.length === 0) {
                return;
            }
            const confirmModal = new bootstrap.Modal(document.getElementById('orderConfirmModal'));
            confirmModal.show();
        }

        function confirmPlaceOrder() {
            cart = [];
            localStorage.removeItem('cart');
            if (typeof displayCart === 'function') displayCart();
            if (typeof updateCartCount === 'function') updateCartCount();
            if (typeof updateWishlistCount === 'function') updateWishlistCount();
            const successModal = new bootstrap.Modal(document.getElementById('orderSuccessModal'));
            successModal.show();
        }

        function confirmClearCart() {
            if (!cart || cart.length === 0) {
                return;
            }
            const clearModal = new bootstrap.Modal(document.getElementById('clearConfirmModal'));
            clearModal.show();
        }

        function finalizeClearCart() {
            cart = [];
            localStorage.removeItem('cart');
            if (typeof displayCart === 'function') displayCart();
            if (typeof updateCartCount === 'function') updateCartCount();
            const successModal = new bootstrap.Modal(document.getElementById('orderSuccessModal'));
            document.getElementById('orderSuccessModalLabel').textContent = 'Cart cleared';
            document.getElementById('orderSuccessText').textContent = 'Your cart has been cleared successfully.';
            successModal.show();
        }
    </script>

    <div class="modal fade" id="orderConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to place this order?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="confirmPlaceOrder()">Yes, Place Order</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="clearConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Clear Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to clear all items from your cart?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="finalizeClearCart()">Yes, Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="orderSuccessModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-body py-5">
                    <i class="fa-solid fa-check-circle fa-3x text-success mb-3"></i>
                    <h5 id="orderSuccessModalLabel">Order confirmed successfully!</h5>
                    <p id="orderSuccessText">Thank you for your purchase.</p>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
